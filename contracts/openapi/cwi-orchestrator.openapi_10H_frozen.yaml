openapi: 3.0.3
info:
  title: CWI Orchestrator MCP API (Frozen 10H)
  version: 10H.1.0
  description: 'Frozen OpenAPI contract for the cwi-orchestrator service.


    Responsibilities:

    - Enforces policy mode and governance checks

    - Performs retrieval across vector shards

    - Builds grounded prompts and calls model endpoints

    - Emits provenance/audit events

    - Provides internal MCP endpoints called by cwi-router


    Sanitized: no internal domains/hosts/secrets.'
servers:
- url: http://cwi-orchestrator:8080
  description: Internal (Docker/Compose) service URL
tags:
- name: MCP
  description: Internal orchestration endpoints used by cwi-router
- name: Health
  description: Liveness/readiness endpoints
- name: Observability
  description: Metrics endpoint
- name: Admin
  description: Administrative governance endpoints
- name: Reports
  description: Governance report review endpoints
- name: Documents
  description: Document catalog and rollback endpoints
- name: Ownership
  description: Ownership lineage and delegation endpoints
- name: OperatorMemory
  description: Operator interaction memory and profiling endpoints
- name: Succession
  description: Ownership succession planning endpoints
- name: Artifacts
  description: Artifact registry endpoints
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    BreakGlassToken:
      type: apiKey
      in: header
      name: X-Break-Glass-Token
      description: Break-glass token required for admin endpoints.
  parameters:
    XRequestId:
      name: X-Request-Id
      in: header
      required: false
      description: Optional caller-supplied correlation ID. If provided, it SHOULD
        be echoed in responses.
      schema:
        type: string
        maxLength: 128
    TenantId:
      name: tenant_id
      in: query
      required: false
      description: Tenant identifier (required when no break-glass token context).
      schema:
        type: string
        maxLength: 128
    OperatorId:
      name: operator_id
      in: query
      required: false
      description: Operator identifier.
      schema:
        type: string
        maxLength: 128
  headers:
    XTraceId:
      description: Trace identifier for correlating logs/OTel spans/ledger records.
      schema:
        type: string
    XRequestId:
      description: Echo of X-Request-Id when provided.
      schema:
        type: string
    XRateLimitLimit:
      description: Max requests per window (implementation-defined).
      schema:
        type: integer
        format: int32
    XRateLimitRemaining:
      description: Remaining requests in current window (implementation-defined).
      schema:
        type: integer
        format: int32
    XRateLimitReset:
      description: UNIX epoch seconds when the current window resets (implementation-defined).
      schema:
        type: integer
        format: int64
    RetryAfter:
      description: Seconds to wait before retrying (commonly used with 429).
      schema:
        type: integer
        format: int32
  schemas:
    PolicyMode:
      type: string
      enum:
      - observe
      - recommend
      - approve
      - auto_within_bounds
      description: Governing mode applied by the orchestrator.
    RiskLevel:
      type: string
      enum:
      - low
      - medium
      - high
    ModelTier:
      type: string
      enum:
      - pro
      - free
      - edge
    ErrorResponse:
      type: object
      required:
      - error
      - message
      properties:
        error:
          type: string
          description: Short error code
        message:
          type: string
          description: Human-readable message
        trace_id:
          type: string
          description: Trace identifier (if available)
    Citation:
      type: object
      required:
      - doc_id
      - chunk_id
      properties:
        doc_id:
          type: string
        chunk_id:
          type: string
        score:
          type: number
          format: float
          nullable: true
    Trace:
      type: object
      required:
      - trace_id
      - sources
      - confidence
      - policy_mode
      - model
      - pack_hash
      properties:
        trace_id:
          type: string
          description: Unique ID correlating logs/OTel spans/ledger records.
        sources:
          type: array
          items:
            type: string
          description: Evidence identifiers (doc chunks, telemetry windows, policy
            rules).
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
        policy_mode:
          $ref: '#/components/schemas/PolicyMode'
        model:
          $ref: '#/components/schemas/ModelTier'
        pack_hash:
          type: string
          description: sha256 hex of the pack.json used for this response.
        guardrails:
          type: array
          items:
            $ref: '#/components/schemas/GuardrailViolation'
          description: Guardrail violations detected during execution.
        validations:
          type: array
          items:
            $ref: '#/components/schemas/ValidationIssue'
          description: Validation findings for the request or response.
        discrepancies:
          type: array
          items:
            $ref: '#/components/schemas/DiscrepancyRecord'
          description: Discrepancies discovered between expected and observed values.
        corrections:
          type: array
          items:
            $ref: '#/components/schemas/CorrectionDiff'
          description: Correction diffs applied during processing.
        operator_profile:
          $ref: '#/components/schemas/OperatorProfileSummary'
        operator_profile_decision:
          $ref: '#/components/schemas/OperatorProfileDecision'
        otel_trace_id:
          type: string
          nullable: true
          description: Optional OpenTelemetry trace ID, if emitted.
    GuardrailViolation:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        severity:
          type: string
        message:
          type: string
    ValidationIssue:
      type: object
      properties:
        rule:
          type: string
        field:
          type: string
        detail:
          type: string
    DiscrepancyRecord:
      type: object
      properties:
        field:
          type: string
        expected:
          type: string
        actual:
          type: string
        note:
          type: string
    CorrectionDiff:
      type: object
      properties:
        field:
          type: string
        from:
          type: string
        to:
          type: string
        note:
          type: string
    OutcomeFeedbackRequest:
      type: object
      required:
      - tenant_id
      - trace_id
      - actor_id
      - feedback
      - consent_granted
      properties:
        tenant_id:
          type: string
        trace_id:
          type: string
        ticket_id:
          type: string
          nullable: true
        action_id:
          type: string
          nullable: true
        actor_id:
          type: string
        idempotency_key:
          type: string
          nullable: true
        feedback:
          type: string
          enum:
          - up
          - down
        consent_granted:
          type: boolean
        reason_codes:
          type: array
          items:
            type: string
        note:
          type: string
          nullable: true
        confidence_before:
          type: number
          nullable: true
        confidence_after:
          type: number
          nullable: true
    OutcomeFeedbackSummary:
      type: object
      required:
      - tenant_id
      - trace_id
      - up_count
      - down_count
      properties:
        tenant_id:
          type: string
        trace_id:
          type: string
        up_count:
          type: integer
          minimum: 0
        down_count:
          type: integer
          minimum: 0
        last_feedback:
          type: string
          nullable: true
        last_feedback_utc:
          type: string
          format: date-time
          nullable: true
    OutcomeFeedbackResponse:
      type: object
      required:
      - tenant_id
      - trace_id
      - actor_id
      - feedback
      - consent_granted
      - recorded_utc
      - summary
      properties:
        tenant_id:
          type: string
        trace_id:
          type: string
        ticket_id:
          type: string
          nullable: true
        action_id:
          type: string
          nullable: true
        actor_id:
          type: string
        idempotency_key:
          type: string
          nullable: true
        feedback:
          type: string
          enum:
          - up
          - down
        consent_granted:
          type: boolean
        note:
          type: string
          nullable: true
        confidence_before:
          type: number
          nullable: true
        confidence_after:
          type: number
          nullable: true
        recorded_utc:
          type: string
          format: date-time
        summary:
          $ref: '#/components/schemas/OutcomeFeedbackSummary'
    SurvivalSignal:
      type: object
      required:
      - signal_type
      - severity
      properties:
        signal_type:
          type: string
        severity:
          type: number
          minimum: 0
          maximum: 1
        details:
          type: string
          nullable: true
        observed_utc:
          type: string
          format: date-time
    SurvivalStatus:
      type: object
      required:
      - mode
      - profile
      - offline_message
      properties:
        mode:
          type: string
          enum:
          - normal
          - degraded
          - survival
        profile:
          type: string
        last_signal_utc:
          type: string
          format: date-time
          nullable: true
        offline_message:
          type: string
    OfflineResponse:
      type: object
      required:
      - mode
      - message
      properties:
        mode:
          type: string
          enum:
          - normal
          - degraded
          - survival
        message:
          type: string
    AskRequest:
      type: object
      required:
      - tenant_id
      - user_id
      - question
      - pack
      - context
      properties:
        tenant_id:
          type: string
        user_id:
          type: string
        question:
          type: string
        pack:
          type: object
          required:
          - name
          properties:
            name:
              type: string
              description: Pack name (enterprise|personal|...)
            anchor:
              type: string
              nullable: true
              description: Optional client-known pack sha256 to include for validation.
        context:
          type: object
          required:
          - mode
          properties:
            mode:
              $ref: '#/components/schemas/PolicyMode'
            top_k:
              type: integer
              minimum: 1
              maximum: 50
              default: 8
    AskResponse:
      type: object
      required:
      - answer
      - citations
      - trace
      properties:
        answer:
          type: string
        citations:
          type: array
          items:
            $ref: '#/components/schemas/Citation'
        trace:
          $ref: '#/components/schemas/Trace'
    ActionRequest:
      type: object
      required:
      - tenant_id
      - user_id
      - action
      - policy_mode
      properties:
        tenant_id:
          type: string
        user_id:
          type: string
        policy_mode:
          $ref: '#/components/schemas/PolicyMode'
        action:
          type: object
          required:
          - type
          - payload
          properties:
            type:
              type: string
              description: Action identifier/type.
            payload:
              type: object
              additionalProperties: true
    ApprovalTicket:
      type: object
      required:
      - ticket_id
      - risk
      - reason
      properties:
        ticket_id:
          type: string
        risk:
          $ref: '#/components/schemas/RiskLevel'
        reason:
          type: string
    OwnershipTransferRequest:
      type: object
      required:
      - tenant_id
      - from_user_id
      - to_user_id
      properties:
        tenant_id:
          type: string
        from_user_id:
          type: string
        to_user_id:
          type: string
        transfer_type:
          type: string
          enum:
          - transfer
          - delegate
        reason:
          type: string
          nullable: true
        required_approvals:
          type: integer
          format: int32
          minimum: 1
        approver_ids:
          type: array
          items:
            type: string
    OwnershipTransferResponse:
      type: object
      required:
      - request_id
      - status
      - transfer_type
      - required_approvals
      - approver_ids
      - approved_by
      - created_utc
      - updated_utc
      properties:
        approval_ticket:
          allOf:
          - $ref: '#/components/schemas/ApprovalTicket'
          nullable: true
        request_id:
          type: string
        status:
          type: string
        transfer_type:
          type: string
        required_approvals:
          type: integer
          format: int32
        approver_ids:
          type: array
          items:
            type: string
        approved_by:
          type: array
          items:
            type: string
        created_utc:
          type: string
          format: date-time
        updated_utc:
          type: string
          format: date-time
        completed_utc:
          type: string
          format: date-time
          nullable: true
    OwnershipTransferRevokeRequest:
      type: object
      required:
      - request_id
      - actor_id
      properties:
        request_id:
          type: string
        actor_id:
          type: string
        reason:
          type: string
          nullable: true
    ActionResponse:
      type: object
      required:
      - executed
      - trace
      properties:
        executed:
          type: boolean
        approval_ticket:
          allOf:
          - $ref: '#/components/schemas/ApprovalTicket'
          nullable: true
        result:
          type: object
          nullable: true
          additionalProperties: true
        trace:
          $ref: '#/components/schemas/Trace'
    ApprovalCompleteRequest:
      type: object
      required:
      - ticket_id
      - decision
      - approver_id
      properties:
        ticket_id:
          type: string
        decision:
          type: string
          enum:
          - approve
          - deny
        approver_id:
          type: string
        reason:
          type: string
          nullable: true
    ApprovalCompleteResponse:
      type: object
      required:
      - ticket_id
      - status
      - executed
      - trace
      properties:
        ticket_id:
          type: string
        status:
          type: string
          enum:
          - approved
          - denied
        executed:
          type: boolean
        trace:
          $ref: '#/components/schemas/Trace'
    ReconciliationApprovalCompleteResponse:
      type: object
      required:
      - record_id
      - ticket_id
      - status
      - decision
      - conflicts_count
      - updated_utc
      properties:
        record_id:
          type: string
        ticket_id:
          type: string
        status:
          type: string
          enum:
          - approved
          - denied
        decision:
          type: string
          enum:
          - approve
          - deny
        conflicts_count:
          type: integer
        updated_utc:
          type: string
          format: date-time
    TelemetryWindow:
      type: object
      required:
      - start
      - end
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
    TelemetrySignal:
      type: object
      required:
      - tag
      - unit
      - series
      properties:
        tag:
          type: string
        unit:
          type: string
        series:
          type: array
          items:
            type: number
            format: float
    TelemetryIngestRequest:
      type: object
      required:
      - tenant_id
      - window
      - signals
      - metadata
      properties:
        tenant_id:
          type: string
        window:
          $ref: '#/components/schemas/TelemetryWindow'
        signals:
          type: array
          items:
            $ref: '#/components/schemas/TelemetrySignal'
        metadata:
          type: object
          additionalProperties: true
    TelemetryIngestResponse:
      type: object
      required:
      - accepted
      - ingest_id
      - trace
      properties:
        accepted:
          type: boolean
        ingest_id:
          type: string
        trace:
          $ref: '#/components/schemas/Trace'
    HealthResponse:
      type: object
      required:
      - ok
      - services
      properties:
        ok:
          type: boolean
        services:
          type: object
          additionalProperties:
            type: string
          description: Map of subsystem -> status string.
    ReadyCheck:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - ok
          - degraded
          - down
        detail:
          type: string
          nullable: true
        latency_ms:
          type: integer
          format: int32
          nullable: true
    ReadyResponse:
      type: object
      required:
      - ready
      - checks
      properties:
        ready:
          type: boolean
        checks:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ReadyCheck'
        timestamp:
          type: string
          format: date-time
          nullable: true
        version:
          type: string
          nullable: true
    RoutingDecision:
      type: object
      description: Optional router-provided routing metadata (used for debugging/audit;
        not required for correctness).
      properties:
        selected_tier:
          $ref: '#/components/schemas/ModelTier'
        selected_endpoint:
          type: string
          nullable: true
          description: Chosen upstream model base URL or identifier (sanitized).
        reason:
          type: string
          nullable: true
    KillSwitchStatusResponse:
      type: object
      required:
      - enabled
      - irreversible
      properties:
        enabled:
          type: boolean
        irreversible:
          type: boolean
        updated_utc:
          type: string
          format: date-time
          nullable: true
    KillSwitchToggleRequest:
      type: object
      required:
      - enabled
      properties:
        enabled:
          type: boolean
        kill_code:
          type: string
          nullable: true
        token_id:
          type: string
          nullable: true
        irreversible:
          type: boolean
    KillSwitchTokenRequest:
      type: object
      properties:
        kill_code:
          type: string
          nullable: true
        ttl_seconds:
          type: integer
          format: int32
          minimum: 1
          nullable: true
    KillSwitchTokenResponse:
      type: object
      required:
      - token_id
      - expires_utc
      properties:
        token_id:
          type: string
        expires_utc:
          type: string
          format: date-time
    McpAskRequest:
      allOf:
      - $ref: '#/components/schemas/AskRequest'
      - type: object
        properties:
          routing:
            $ref: '#/components/schemas/RoutingDecision'
    McpActionRequest:
      allOf:
      - $ref: '#/components/schemas/ActionRequest'
      - type: object
        properties:
          routing:
            $ref: '#/components/schemas/RoutingDecision'
    ReportEvidence:
      type: object
      required:
      - label
      - value
      properties:
        label:
          type: string
        value:
          type: string
    ReportSummary:
      type: object
      required:
      - report_id
      - title
      - created_utc
      - status
      - coherence_score
      - conflict_count
      - summary
      properties:
        report_id:
          type: string
        title:
          type: string
        created_utc:
          type: string
          format: date-time
        status:
          type: string
        coherence_score:
          type: number
          format: double
        conflict_count:
          type: integer
          format: int32
        summary:
          type: string
        escalation_ticket:
          type: string
          nullable: true
    ReportDetail:
      allOf:
      - $ref: '#/components/schemas/ReportSummary'
      - type: object
        required:
        - narrative
        - structured
        - evidence
        properties:
          narrative:
            type: string
          structured:
            type: object
            additionalProperties:
              type: string
          evidence:
            type: array
            items:
              $ref: '#/components/schemas/ReportEvidence'
    DocumentVersion:
      type: object
      required:
      - version
      - created_utc
      - author
      - checksum
      - notes
      - content
      properties:
        version:
          type: string
        created_utc:
          type: string
          format: date-time
        author:
          type: string
        checksum:
          type: string
        notes:
          type: string
        content:
          type: string
    DocumentSummary:
      type: object
      required:
      - doc_id
      - title
      - type
      - owner
      - status
      - versions_count
      - latest_version
      properties:
        doc_id:
          type: string
        title:
          type: string
        type:
          type: string
        owner:
          type: string
        status:
          type: string
        versions_count:
          type: integer
          format: int32
        latest_version:
          type: string
    DocumentDetail:
      type: object
      required:
      - doc_id
      - title
      - type
      - owner
      - status
      - versions
      properties:
        doc_id:
          type: string
        title:
          type: string
        type:
          type: string
        owner:
          type: string
        status:
          type: string
        versions:
          type: array
          items:
            $ref: '#/components/schemas/DocumentVersion'
    DocumentRollbackRequest:
      type: object
      required:
      - tenant_id
      - actor_id
      - target_version
      properties:
        tenant_id:
          type: string
        actor_id:
          type: string
        target_version:
          type: string
        reason:
          type: string
          nullable: true
    DocumentRollbackResponse:
      type: object
      required:
      - rollback_id
      - doc_id
      - target_version
      - status
      - requested_by
      - requested_utc
      properties:
        rollback_id:
          type: string
        doc_id:
          type: string
        target_version:
          type: string
        status:
          type: string
        requested_by:
          type: string
        requested_utc:
          type: string
          format: date-time
        message:
          type: string
          nullable: true
    OwnershipLineageNode:
      type: object
      required:
      - node_id
      - label
      - role
      - status
      properties:
        node_id:
          type: string
        label:
          type: string
        role:
          type: string
        status:
          type: string
    OwnershipLineageEdge:
      type: object
      required:
      - from
      - to
      - scope
      - relationship
      properties:
        from:
          type: string
        to:
          type: string
        scope:
          type: string
        relationship:
          type: string
    OwnershipLineageResponse:
      type: object
      required:
      - nodes
      - edges
      properties:
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/OwnershipLineageNode'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/OwnershipLineageEdge'
    OwnershipRevocationEntry:
      type: object
      required:
      - request_id
      - subject
      - scope
      - reason
      - requested_by
      - status
      - updated_utc
      properties:
        request_id:
          type: string
        subject:
          type: string
        scope:
          type: string
        reason:
          type: string
        requested_by:
          type: string
        status:
          type: string
        updated_utc:
          type: string
          format: date-time
    OperatorConsent:
      type: object
      required:
      - granted
      properties:
        granted:
          type: boolean
        granted_utc:
          type: string
          format: date-time
          nullable: true
        source:
          type: string
          nullable: true
    OperatorSignal:
      type: object
      required:
      - signal_type
      - value
      - unit
      - occurred_utc
      properties:
        signal_type:
          type: string
        value:
          type: number
        unit:
          type: string
        confidence:
          type: number
          nullable: true
        occurred_utc:
          type: string
          format: date-time
    OperatorPerformance:
      type: object
      required:
      - metric
      - value
      - unit
      - window_utc
      properties:
        metric:
          type: string
        value:
          type: number
        unit:
          type: string
        confidence:
          type: number
          nullable: true
        window_utc:
          type: string
          format: date-time
    OperatorMemoryIngestRequest:
      type: object
      required:
      - tenant_id
      - operator_id
      - consent
      properties:
        tenant_id:
          type: string
        operator_id:
          type: string
        session_id:
          type: string
          nullable: true
        consent:
          $ref: '#/components/schemas/OperatorConsent'
        signals:
          type: array
          items:
            $ref: '#/components/schemas/OperatorSignal'
        performance:
          type: array
          items:
            $ref: '#/components/schemas/OperatorPerformance'
        metadata:
          type: object
          additionalProperties:
            type: string
    OperatorProfileSummary:
      type: object
      required:
      - tenant_id
      - operator_id
      - signals_total
      - correction_rate
      - delay_rate
      - confirmation_rate
      - correlation_score
      - last_updated_utc
      properties:
        tenant_id:
          type: string
        operator_id:
          type: string
        signals_total:
          type: integer
