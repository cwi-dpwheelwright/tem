version: "3.9"

services:
  cwi-teams-bot:
    image: ${TEAMS_BOT_IMAGE}
    container_name: internal-01-bot-teams
    environment:
      PORT: ${TEAMS_BOT_PORT}
      MICROSOFT_APP_ID: ${MICROSOFT_APP_ID}
      MICROSOFT_APP_PASSWORD: ${MICROSOFT_APP_PASSWORD}
      ALLOW_UNAUTHENTICATED: ${ALLOW_UNAUTHENTICATED}
      BOT_TOKEN_ISSUER: ${BOT_TOKEN_ISSUER}
      BOT_TOKEN_AUDIENCE: ${BOT_TOKEN_AUDIENCE}
      BOT_TOKEN_JWKS_URL: ${BOT_TOKEN_JWKS_URL}
      BOT_TENANT_ALLOWLIST: ${BOT_TENANT_ALLOWLIST}
      GATEWAY_BASE_URL: ${GATEWAY_BASE_URL}
      GATEWAY_STATIC_TOKEN: ${GATEWAY_STATIC_TOKEN}
      GATEWAY_OAUTH_TOKEN_URL: ${GATEWAY_OAUTH_TOKEN_URL}
      GATEWAY_OAUTH_CLIENT_ID: ${GATEWAY_OAUTH_CLIENT_ID}
      GATEWAY_OAUTH_CLIENT_SECRET: ${GATEWAY_OAUTH_CLIENT_SECRET}
      GATEWAY_OAUTH_SCOPE: ${GATEWAY_OAUTH_SCOPE}
      APPROVER_ALLOWLIST: ${APPROVER_ALLOWLIST}
      APPROVER_ROLE_MAP: ${APPROVER_ROLE_MAP}
      REDIS_URL: ${REDIS_URL}
      POSTGRES_URL: ${POSTGRES_URL}
      IDEMPOTENCY_TTL_SECONDS: ${IDEMPOTENCY_TTL_SECONDS}
      BREAK_GLASS_WEBHOOK_URL: ${BREAK_GLASS_WEBHOOK_URL}
      BREAK_GLASS_WEBHOOK_SECRET: ${BREAK_GLASS_WEBHOOK_SECRET}
      BREAK_GLASS_DEDUPE_TTL_SECONDS: ${BREAK_GLASS_DEDUPE_TTL_SECONDS}
      BREAK_GLASS_THROTTLE_WINDOW_SECONDS: ${BREAK_GLASS_THROTTLE_WINDOW_SECONDS}
    ports:
      - "${TEAMS_BOT_PORT}:3978"
    networks:
      - cwi-internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3978/health"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  cwi-internal:
    name: cwi-internal
