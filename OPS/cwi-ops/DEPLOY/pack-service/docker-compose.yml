version: "3.9"

services:
  cwi-pack-service:
    image: nginx:1.25
    container_name: internal-01-core-pack-service
    env_file: .env
    ports:
      - "${PACK_SERVICE_HTTP_PORT}:8082"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./validate-packs.sh:/validate-packs.sh:ro
      - ${PACKS_DIR}:/packs:ro
    command: ["/bin/sh", "-c", "/validate-packs.sh && nginx -g 'daemon off;'"]
    networks:
      - cwi-internal
    restart: unless-stopped

networks:
  cwi-internal:
    name: cwi-internal
