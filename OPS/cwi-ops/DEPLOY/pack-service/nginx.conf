worker_processes  1;

events {
  worker_connections  1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;

  access_log /var/log/nginx/access.log;
  error_log /var/log/nginx/error.log warn;

  server {
    listen 8082;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    add_header X-Frame-Options "DENY" always;

    location = /packs {
      rewrite ^ /packs/index.json break;
      root /;
      try_files $uri =404;
    }

    location ~ ^/packs/([^/]+)$ {
      rewrite ^/packs/([^/]+)$ /packs/$1/pack.json break;
      root /;
      try_files $uri =404;
    }

    location /packs/ {
      root /;
      try_files $uri =404;
    }

    location /reports {
      root /packs/artifacts;
      try_files $uri $uri/index.json =404;
    }

    location /docs {
      root /packs/artifacts;
      try_files $uri $uri/index.json =404;
    }

    location /artifacts/reports {
      root /packs;
      try_files $uri $uri/index.json =404;
    }

    location /artifacts/docs {
      root /packs;
      try_files $uri $uri/index.json =404;
    }
  }
}
