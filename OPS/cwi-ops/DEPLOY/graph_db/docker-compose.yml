version: "3.9"

services:
  cwi-age-db:
    image: ${CWI_GRAPH_DB_IMAGE}
    container_name: ${CWI_AGE_DB_CONTAINER_NAME:-cwi-age-db}
    environment:
      POSTGRES_USER: ${CWI_GRAPH_DB_USER}
      POSTGRES_PASSWORD: ${CWI_GRAPH_DB_PASSWORD}
      POSTGRES_DB: ${CWI_GRAPH_DB_DATABASE}
    volumes:
      - ${CWI_GRAPH_DB_DATA_DIR}:/var/lib/postgresql
      - ${CWI_GRAPH_WORK_AGE_HOST_DIR:-/srv/cwi/graph-work/age}:/srv/cwi/graph-work/age:ro
    ports:
      - "${CWI_GRAPH_DB_HOST_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cwi-internal
    restart: unless-stopped

networks:
  cwi-internal:
    name: cwi-internal
