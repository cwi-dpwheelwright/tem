coordinator_url: http://100.120.208.51:18086
enrollment_url: http://100.120.208.51:18086/api/membership/enroll
identity:
  # Recommended for home nodes: derive once from /etc/machine-id using
  # machine-id-sha256-v1 and persist it as:
  # home-<first32hex(sha256(machine-id))>
  # On Linux home nodes you can also set `node_id: auto` to derive it at runtime.
  node_id: auto
  machine_id_path: /etc/machine-id
  private_key_path: /var/lib/cwi-node-agent/state/identity/private_key.pem
  public_key_path: /var/lib/cwi-node-agent/state/identity/public_key.pem
  key_type: ed25519
  persist_keys: true
storage:
  state_dir: /var/lib/cwi-node-agent/state
activation:
  require_signature: false
  expected_issuer: cwi-ops
  expected_audience: cwi-node-agent-runtime
  public_key_path: /var/lib/cwi-node-agent/state/identity/activation_pub.pem
  nonce_cache_max_entries: 10000
kill_switch:
  admin_url: http://100.120.208.51:18085/api/admin/kill_switch
  tenant_id: tenant-1
  break_glass_token_env: CWI_BREAK_GLASS_TOKEN
  retry_attempts: 3
  retry_backoff_seconds: 1
bundle:
  crypto_provider: noop
cache:
  cache_dir: /var/lib/cwi-node-agent/state/cache
  max_bytes: 104857600
  max_items: 1000
  require_sha256: true
  require_signature: false
baseline_packs:
  roots:
    - /var/lib/cwi-node-agent/state/baseline-packs/cwi-intent-interpreter
    - /var/lib/cwi-node-agent/state/baseline-packs/cwi-memory-policy
    - /var/lib/cwi-node-agent/state/baseline-packs/cwi-memory-capsule
    - /var/lib/cwi-node-agent/state/baseline-packs/cwi-source-retrieval
    - /var/lib/cwi-node-agent/state/baseline-packs/cwi-identity
    - /var/lib/cwi-node-agent/state/baseline-packs/cwi-values-core
    - /var/lib/cwi-node-agent/state/baseline-packs/cwi-values-biblical
    - /var/lib/cwi-node-agent/state/baseline-packs/cwi-ethical-reasoner
    - /var/lib/cwi-node-agent/state/baseline-packs/cwi-safety-guardrails
    - /var/lib/cwi-node-agent/state/baseline-packs/cwi-response-orchestrator
    - /var/lib/cwi-node-agent/state/baseline-packs/cwi-communication-core
local_model:
  enabled: true
  provider: ollama
  base_url: http://cwi-node-agent-ollama:11434
  base_url_env: CWI_HOME_NODE_LOCAL_MODEL_BASE_URL
  model: llama3.1:8b
  model_env: CWI_HOME_NODE_LOCAL_MODEL
  model_family: 7b/8b-instruct
  quantization: Q4_K_M
  context_tokens: 4096
  max_vram_gb: 6
  timeout_seconds: 45
resilience:
  max_entries: 1000
  max_bytes: 10485760
  max_attempts: 3
  backoff_seconds: 1
data_boundary:
  allow_raw_data: false
priority:
  survival_mode: false
  min_priority_level: 50
  header_name: X-CWI-Priority
link_metrics:
  transport_url: http://100.120.208.51:18086/api/transport/link-metrics
  transport_timeout_seconds: 5
  use_envelope: true
metrics_signing:
  require_signature: false
  replay_window: 1000
reroute:
  warning_threshold: 0.7
  critical_threshold: 0.9
  clear_threshold: 0.5
  cooldown_seconds: 60
  transport_timeout_seconds: 5
job_runner:
  allow_commands:
    - python
  default_timeout_seconds: 60
status:
  timeout_seconds: 5
qr_service:
  identifier_version: machine-id-sha256-v1
  allowed_networks:
    - 127.0.0.1/32
    - ::1/128
    - 100.64.0.0/10
    - fd7a:115c:a1e0::/48
control_session:
  connect_url: ws://100.120.208.51:18086/control/nodes/connect
  tenant_id_env: CWI_HOME_NODE_TENANT_ID
  owner_user_id_env: CWI_HOME_NODE_OWNER_USER_ID
  friendly_name_env: CWI_HOME_NODE_FRIENDLY_NAME
  runtime_version: home-node-20260423-core-packs
  policy_profile_version: "1.0"
  work_token_issuer: cwi-orchestrator
  work_token_secret_env: CWI_HOME_NODE_WORK_TOKEN_SECRET
enrollment:
  cert_fingerprint: 032c311b95ac9a14a81f0b3fa2520ae9dcb59db884444721f9a8799dcae7e976
  request_timeout_seconds: 10
  protocol_version: "1.0"
degradation:
  cpu_warning_load: 1.0
  cpu_critical_load: 2.0
  cpu_warning_percent: 70
  cpu_critical_percent: 90
  disk_warning_free_ratio: 0.1
  disk_critical_free_ratio: 0.05
  memory_warning_free_ratio: 0.2
  memory_critical_free_ratio: 0.1
  transport_timeout_seconds: 5
readiness:
  max_degradation_severity: 0.9
  dependency_timeout_seconds: 2
  dependency_urls:
    - http://100.120.208.51:18086/api/health
