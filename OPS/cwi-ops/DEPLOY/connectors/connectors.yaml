tenant_id: "tenant-1"
workspace_id: "workspace-1"
poll_interval_seconds: 300
state_store:
  kind: "file"
  path: "/var/lib/cwi-connectors/state.json"
vector_ingest_url: "https://gateway.your-domain"
vector_ingest_token: "env://CWI_CONNECTORS_TOKEN"
orchestrator_url: "https://gateway.your-domain"
orchestrator_token: "env://CWI_CONNECTORS_TOKEN"
reconciliation_url: "https://gateway.your-domain"
reconciliation_token: "env://CWI_CONNECTORS_TOKEN"
admin_token: "env://CWI_CONNECTORS_ADMIN_TOKEN"
admin_enabled: true
delivery_queue_path: "/var/lib/cwi-connectors/queue.json"
run_journal_path: "/var/lib/cwi-connectors/runs.json"
retention_state_path: "/var/lib/cwi-connectors/retention.json"
connectors:
  - id: "calendar-primary"
    type: "outlook"
    enabled: false
    config:
      mailbox: "me"
      api_base_url: "https://graph.microsoft.com/v1.0"
    auth:
      type: "api_key"
      api_key:
        header_name: "Authorization"
        value: "env://CWI_CONNECTOR_OUTLOOK_TOKEN"
  - id: "email-primary"
    type: "outlook"
    enabled: false
    config:
      mailbox: "me"
      api_base_url: "https://graph.microsoft.com/v1.0"
    auth:
      type: "api_key"
      api_key:
        header_name: "Authorization"
        value: "env://CWI_CONNECTOR_OUTLOOK_TOKEN"
  - id: "tasks-primary"
    type: "smartsheet"
    enabled: false
    config:
      sheet_id: "env://CWI_CONNECTOR_TASKS_SHEET_ID"
      api_base_url: "https://api.smartsheet.com/2.0"
    auth:
      type: "api_key"
      api_key:
        header_name: "Authorization"
        value: "env://CWI_CONNECTOR_SMARTSHEET_TOKEN"
  - id: "notes-primary"
    type: "google_drive"
    enabled: false
    config:
      root_folder_id: "env://CWI_CONNECTOR_NOTES_FOLDER_ID"
      api_base_url: "https://www.googleapis.com/drive/v3"
    auth:
      type: "api_key"
      api_key:
        header_name: "Authorization"
        value: "env://CWI_CONNECTOR_GOOGLE_DRIVE_TOKEN"
  - id: "documents-primary"
    type: "google_drive"
    enabled: false
    config:
      root_folder_id: "env://CWI_CONNECTOR_DOCUMENTS_FOLDER_ID"
      api_base_url: "https://www.googleapis.com/drive/v3"
    auth:
      type: "api_key"
      api_key:
        header_name: "Authorization"
        value: "env://CWI_CONNECTOR_GOOGLE_DRIVE_TOKEN"
  - id: "alerts-primary"
    type: "json"
    enabled: false
    config:
      path: "/var/lib/cwi-connectors/fixtures/alerts-placeholder.json"
    auth:
      type: "api_key"
      api_key:
        header_name: "X-Api-Key"
        value: "env://CWI_CONNECTOR_ALERTS_TOKEN"
  - id: "workflow-primary"
    type: "json"
    enabled: false
    config:
      path: "/var/lib/cwi-connectors/fixtures/workflows-placeholder.json"
    auth:
      type: "api_key"
      api_key:
        header_name: "X-Api-Key"
        value: "env://CWI_CONNECTOR_WORKFLOW_TOKEN"
