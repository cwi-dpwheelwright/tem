version: "3.9"

services:
  cwi-router:
    image: ${REGISTRY}/cwi-router:${CWI_ROUTER_TAG}
    container_name: internal-01-core-router
    env_file: .env
    ports:
      - "${ROUTER_HTTP_PORT}:8081"
    networks:
      - cwi-internal
    restart: unless-stopped

  cwi-coordination-layer:
    image: ${REGISTRY}/cwi-coordination-layer:${CWI_COORDINATION_TAG}
    container_name: internal-01-core-coordination-layer
    env_file: .env
    ports:
      - "${COORDINATION_HTTP_PORT}:8081"
    networks:
      - cwi-internal
    restart: unless-stopped

networks:
  cwi-internal:
    name: cwi-internal
