services:
  ollama:
    image: ollama/ollama:latest
    container_name: public-llm-ollama
    env_file: .env
    environment:
      OLLAMA_HOST: 0.0.0.0
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "${OLLAMA_HTTP_PORT}:11434"
    networks:
      - cwi-public
    restart: unless-stopped

volumes:
  ollama_data:

networks:
  cwi-public:
    external: true
