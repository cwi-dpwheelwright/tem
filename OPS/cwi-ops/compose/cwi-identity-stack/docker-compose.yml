services:
  postgres:
    image: postgres:16-alpine
    container_name: internal-02-data-postgres
    env_file: .env
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cwi_identity
    networks:
      - cwi-internal
    restart: unless-stopped

  cwi-identity-server:
    image: ${REGISTRY}/cwi-identity-server:${CWI_IDENTITY_TAG}
    container_name: internal-01-identity-server
    env_file: .env
    build:
      context: ../../../..
      dockerfile: src/backend/services/cwi-identity-server/Dockerfile
    depends_on:
      - postgres
    entrypoint: ["sh", "-c", "dotnet Cwi.Identity.Api.dll --migrate && dotnet Cwi.Identity.Api.dll"]
    ports:
      - "${IDENTITY_HTTP_PORT}:8085"
    networks:
      - cwi-internal
    restart: unless-stopped

  cwi-identity-admin:
    image: ${REGISTRY}/cwi-identity-admin:${CWI_IDENTITY_ADMIN_TAG}
    container_name: internal-01-identity-admin
    env_file: .env
    build:
      context: ../../../../src/frontend/web-ui/cwi-identity-admin
      dockerfile: Dockerfile
      args:
        VITE_IDENTITY_BASE_URL: ${VITE_IDENTITY_BASE_URL}
        VITE_ORCHESTRATOR_BASE_URL: ${VITE_ORCHESTRATOR_BASE_URL}
    ports:
      - "${IDENTITY_ADMIN_HTTP_PORT}:80"
    depends_on:
      - cwi-identity-server
    networks:
      - cwi-internal
    restart: unless-stopped

  cwi-coordination-layer:
    image: ${REGISTRY}/cwi-coordination-layer:${CWI_COORDINATION_TAG}
    container_name: internal-01-core-coordination-layer
    env_file: .env
    build:
      context: ../../../..
      dockerfile: src/backend/services/cwi-coordination-layer/Dockerfile
    ports:
      - "${COORDINATION_HTTP_PORT}:8081"
    networks:
      - cwi-internal
    restart: unless-stopped

networks:
  cwi-internal:
    name: cwi-internal
