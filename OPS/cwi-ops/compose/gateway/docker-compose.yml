version: "3.9"

services:
  cwi-gateway:
    image: caddy:2
    container_name: public-core-gateway
    env_file: .env
    ports:
      - "${GATEWAY_HTTP_PORT}:${GATEWAY_HTTP_PORT}"
      - "${GATEWAY_HTTPS_PORT}:${GATEWAY_HTTPS_PORT}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${GATEWAY_HTTP_PORT}/readyz > /dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - cwi-internal
      - cwi-public
    restart: unless-stopped


volumes:
  caddy_data:
  caddy_config:

networks:
  cwi-internal:
    name: cwi-internal
  cwi-public:
    external: true
