global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/prometheus-alerts.yml

scrape_configs:
  - job_name: cwi-router
    metrics_path: /api/metrics
    static_configs:
      - targets:
          - cwi-router:8081

  - job_name: cwi-orchestrator
    metrics_path: /api/metrics
    static_configs:
      - targets:
          - cwi-orchestrator:8081

  - job_name: cwi-vector-shard
    metrics_path: /metrics
    static_configs:
      - targets:
          - cwi-vector-shard:6333
