[project]
name = "cwi-node-agent-runtime"
version = "0.1.0"
description = "CWI node agent runtime"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0.1",
  "cryptography>=42.0.0",
  "psutil>=5.9.0",
  "qrcode>=8.0",
  "websockets>=12.0"
]

[build-system]
requires = ["setuptools>=69.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["node_agent_runtime*"]
exclude = ["configs*"]

[project.scripts]
cwi-node-agent = "node_agent_runtime.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.3.0",
  "mypy>=1.9.0"
]

[tool.pytest.ini_options]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false
