[project]
name = "cwi-connectors"
version = "0.1.0"
description = "CWI connectors framework"
requires-python = ">=3.10"
dependencies = [
  "jsonschema>=4.21.1",
  "PyJWT[crypto]>=2.8.0",
  "PyYAML>=6.0.1",
  "psycopg[binary]>=3.1.19",
  "pypdf>=4.0.0",
  "testcontainers>=3.7.1"
]

[tool.pytest.ini_options]
addopts = "-q"
markers = [
  "integration: tests requiring docker or external services"
]
