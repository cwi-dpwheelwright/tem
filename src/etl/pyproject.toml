[project]
name = "cwi-etl"
version = "0.1.0"
description = "CWI ETL utilities"
requires-python = ">=3.10"
dependencies = [
  "jsonschema>=4.21.1",
  "PyYAML>=6.0.1"
]

[tool.pytest.ini_options]
addopts = "-q"
markers = [
  "integration: requires external services",
]

[tool.setuptools]
packages = ["cwi_etl"]

[tool.setuptools.package-data]
cwi_etl = ["ontology/*.yaml"]
